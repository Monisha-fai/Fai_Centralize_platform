<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 537" width="1024" height="537">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07182e"/>
      <stop offset="50%" stop-color="#0a1f3a"/>
      <stop offset="100%" stop-color="#061528"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#14b8a6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="537" fill="url(#bg)"/>

  <!-- Decorative Waves -->
  <path d="M400 370 C 580 340, 720 440, 1024 380" fill="none" stroke="#102a4a" stroke-width="2.5" opacity="0.6"/>
  <path d="M400 420 C 600 380, 750 490, 1024 430" fill="none" stroke="#102a4a" stroke-width="2.5" opacity="0.6"/>
  <path d="M400 470 C 620 420, 780 540, 1024 480" fill="none" stroke="#102a4a" stroke-width="2.5" opacity="0.6"/>

  <!-- Icon Squircle -->
  <rect x="75" y="125" width="287" height="287" rx="60" fill="#0b2440" stroke="#1b4267" stroke-width="3" filter="url(#glow)"/>

  <!-- Marketplace / Shopping Cart Icon with Sprout -->
  <g transform="translate(142, 190)">
    <!-- Cart Body -->
    <path d="M12 20 L40 20 L66 95 L125 95 L145 42 L48 42" fill="none" stroke="#2dd4bf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Wheels -->
    <circle cx="75" cy="118" r="11" fill="#2dd4bf"/>
    <circle cx="118" cy="118" r="11" fill="#2dd4bf"/>
    <!-- Leaf Sprout in Cart -->
    <path d="M95 65 C 95 38, 122 24, 122 24 C 122 24, 122 51, 95 65 Z" fill="#2ecc71"/>
    <path d="M96 64 C 96 42, 76 32, 76 32 C 76 32, 78 54, 96 64 Z" fill="#27ae60"/>
    <path d="M95 65 L95 82" stroke="#2ecc71" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Title Text -->
  <text x="400" y="215" fill="#ffffff" font-family="Manrope, system-ui, -apple-system, sans-serif" font-size="74" font-weight="800" letter-spacing="-1">E-commerce</text>
  <text x="400" y="295" fill="url(#tealGrad)" font-family="Manrope, system-ui, -apple-system, sans-serif" font-size="74" font-weight="800" letter-spacing="-1">Platform</text>

  <!-- Accent Line -->
  <rect x="404" y="325" width="80" height="6" rx="3" fill="#2dd4bf"/>

  <!-- Subtitle -->
  <text x="404" y="380" fill="#94a9c9" font-family="Manrope, system-ui, -apple-system, sans-serif" font-size="27" font-weight="400" letter-spacing="0.2">Multilingual marketplace for agri inputs</text>
  <text x="404" y="418" fill="#94a9c9" font-family="Manrope, system-ui, -apple-system, sans-serif" font-size="27" font-weight="400" letter-spacing="0.2">and outputs.</text>
</svg>